<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>David Poussif</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f7f7f7;
            color: #333;
            text-align: center;
        }
        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
        }
        h1 { margin: 0; font-size: 2rem; }
        h2 { font-weight: normal; color: #666; margin-bottom: 30px; font-size: 1.2rem; }
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 250px;
        }
        .btn {
            padding: 12px 20px;
            background-color: #333;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #555;
        }

    <img src="./data/profile pic.png" alt="David Poussif" class="profile-img">

    <h2>Technical Project Manager | Agile & CI/CD | Data Scientist </h2>

    <div class="buttons">
        <a href="https://github.com/jonid89" class="btn" target="_blank">GitHub Projects</a>
        <a href="./data/CV - David Poussif.pdf" class="btn" download>Download CV</a>
