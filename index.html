<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>David Poussif</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #121212;
            color: #f7f7f7;
            text-align: center;
        }
        .profile-img {
            width: 90%;
            max-width: 300px;
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            object-fit: cover;
            object-position: 50% 60%; /* try 'bottom', 'center', or '50% 20%' to adjust framing */
            margin-bottom: 20px;
        }
        h1 { margin: 0; font-size: 2rem; }
        h2 { font-weight: normal; color: #aaa; margin-bottom: 30px; font-size: 1.2rem; }
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 250px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 20px;
            background-color: #2a2a2a;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: background 0.3s;
            border: 1px solid #444;
        }
        .btn:hover {
            background-color: #444;
        }
    </style>
</head>
<body>

    <img src="./data/profile pic.png" alt="David Poussif" class="profile-img">
    
    <h1>David Poussif</h1>
    <h2>Technical Project Manager | Agile & CI/CD | Data Scientist</h2>

    <div class="buttons">

        <a href="./data/CV - David Poussif.pdf" class="btn" download><i class="fa-solid fa-file-pdf"></i> Download CV</a>
        <a href="https://www.linkedin.com/in/david-poussif-2b28b714/" class="btn" target="_blank"><i class="fa-brands fa-linkedin"></i> LinkedIn</a>
    </div>

</body>
</html>
